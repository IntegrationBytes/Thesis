[project]
name = "sulo-thesis"
version = "1.0.0"
description = "Ontology-driven KG construction with layered feedback validation - thesis code"
requires-python = ">=3.13"
dependencies = [
    "rdflib>=7.6.0",
    "pyshacl>=0.31.0",
    "openai>=2.20.0",
    "PyPDF2>=3.0.1",
    "python-dotenv>=1.2.1",
    # Required by pipeline/stats.py (bootstrap CI, binomial exact CI, sign test).
    "numpy>=2.4.2",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
# Notebook / plotting stack — not needed to run the pipeline or stats.
analysis = [
    "pandas>=2.3.3",
    "matplotlib>=3.10.8",
    "jupyter>=1.1.1",
]
# Unit tests for pure functions in pipeline/ (metrics, canonicalization,
# stats kernel). Not required to run the pipeline; run with `uv run pytest`.
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
